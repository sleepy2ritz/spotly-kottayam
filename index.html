<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spotly - Kottayam Edition</title>
<!-- Leaflet CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { 
    --bg-dark: #0b0f17; 
    --card-bg: rgba(18, 26, 38, 0.85); 
    --cyan: #00d2ff;
    --purple: #a855f7;
    --green: #10b981;
    --text: #f4f4f5; 
    --text-muted: #9ca3af; 
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-dark); 
    color: var(--text); 
    height: 100vh; 
    width: 100vw;
    overflow: hidden; 
    position: relative;
  }

  /* Full Screen Map */
  #map { 
    position: absolute; 
    top: 0; left: 0; width: 100%; height: 100%; 
    z-index: 1; 
    background: #090d14;
  }

  /* Header Bar Overlay */
  .top-header {
    position: absolute; top: 12px; left: 12px; right: 12px;
    z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .top-header * { pointer-events: auto; }

  .brand-pill {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 14px;
    border-radius: 20px;
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 1rem;
  }
  .edition-badge {
    background: rgba(0, 210, 255, 0.15);
    color: var(--cyan);
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 12px;
    border: 1px solid rgba(0, 210, 255, 0.3);
  }

  .mic-indicator {
    background: rgba(15, 23, 42, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    color: var(--text-muted);
    display: flex; align-items: center; gap: 6px;
  }
  .dot-glow { width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 8px var(--cyan); }

  /* Floating Filter Scrollbar */
  .filter-bar {
    position: absolute; top: 56px; left: 12px; right: 12px;
    z-index: 10;
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }

  .search-pill {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 8px 14px;
    color: var(--text-muted);
    font-size: 0.85rem;
    display: flex; align-items: center; gap: 6px;
    min-width: 130px;
  }
  .filter-chip {
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 0.82rem;
    white-space: nowrap;
    color: var(--text-muted);
    cursor: pointer;
    transition: 0.2s;
  }
  .filter-chip.active {
    background: var(--cyan);
    color: #000;
    font-weight: 600;
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
  }

  /* Custom Glowing Map Markers */
  .spot-marker {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 50%;
    background: rgba(15, 23, 42, 0.9);
    border: 2px solid var(--cyan);
    box-shadow: 0 0 15px rgba(0, 210, 255, 0.4), inset 0 0 10px rgba(0, 210, 255, 0.2);
    display: flex; justify-content: center; align-items: center;
    font-size: 1.2rem;
  }
  .spot-marker.crowded {
    border-color: #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
  }
  .marker-badge-top {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: var(--cyan); color: #000;
    font-size: 0.65rem; font-weight: 800;
    padding: 1px 6px; border-radius: 10px;
    display: flex; align-items: center; gap: 2px;
  }
  .marker-badge-bottom {
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    background: #1e293b; color: #f59e0b;
    font-size: 0.6rem; font-weight: 700;
    padding: 1px 5px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
  }

  /* Bottom Floating Actions UI */
  .bottom-actions {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10;
    display: flex; gap: 10px;
    background: rgba(10, 15, 26, 0.85);
    backdrop-filter: blur(16px);
    padding: 8px;
    border-radius: 28px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .action-btn {
    width: 80px; height: 68px;
    border-radius: 20px;
    border: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: #000; font-weight: 700; font-size: 0.72rem;
    cursor: pointer; transition: transform 0.2s;
  }
  .action-btn:active { transform: scale(0.95); }
  .btn-cyan { background: var(--cyan); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3); }
  .btn-purple { background: var(--purple); color: #fff; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3); }
  .btn-dark { background: rgba(30, 41, 59, 0.9); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
  .btn-icon { font-size: 1.2rem; }

  /* Custom Popup Modal styling */
  .leaflet-popup-content-wrapper {
    background: rgba(15, 23, 42, 0.95) !important;
    backdrop-filter: blur(12px);
    color: #fff !important;
    border-radius: 16px !important;
    border: 1px solid rgba(255,255,255,0.15);
    box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
  }
  .leaflet-popup-tip { background: rgba(15, 23, 42, 0.95) !important; }
  .popup-title { font-size: 1rem; font-weight: bold; margin-bottom: 4px; }
  .popup-sub { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
  .popup-tags { display: flex; gap: 6px; font-size: 0.7rem; }
  .popup-tag { background: rgba(255,255,255,0.1); padding: 3px 6px; border-radius: 6px; }
</style>
</head>
<body>

<div class="top-header">
  <div class="brand-pill">
    📍 spotly <span class="edition-badge">Kottayam</span>
  </div>
  <div class="mic-indicator">
    <div class="dot-glow"></div> Mic: <span id="mic-db">-- dB</span>
  </div>
</div>

<div class="filter-bar">
  <div class="search-pill">🔍 Search spot...</div>
  <div class="filter-chip active">All Spots</div>
  <div class="filter-chip">🍃 Quiet (&lt;35dB)</div>
  <div class="filter-chip">⚡ Power Outlets</div>
  <div class="filter-chip">☕ Cafes</div>
</div>

<div id="map"></div>

<div class="bottom-actions">
  <button class="action-btn btn-cyan" onclick="toggleMic()">
    <span class="btn-icon">🎙️</span>
    <span>Mic Meter</span>
  </button>
  <button class="action-btn btn-purple" onclick="findNearestQuiet()">
    <span class="btn-icon">⚡</span>
    <span>Nearest Quiet</span>
  </button>
  <button class="action-btn btn-dark" onclick="dropPin()">
    <span class="btn-icon">📍</span>
    <span>Drop Pin</span>
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  let map;

  const spots = [
    { name: "Nahdi Kuzhimandi", lat: 9.5841, lng: 76.5273, icon: "🍔", crowd: 28, net: "5G", quiet: false },
    { name: "Tonico Cafe", lat: 9.5962, lng: 76.5414, icon: "💻", crowd: 2, net: "5G", quiet: true },
    { name: "Third Place", lat: 9.5850, lng: 76.5200, icon: "📚", crowd: 4, net: "5G", quiet: true },
    { name: "12 to 12 Barbeque", lat: 9.5875, lng: 76.5245, icon: "🏟️", crowd: 18, net: "5G", quiet: false },
    { name: "Wheels & Brews", lat: 9.5920, lng: 76.5310, icon: "🌲", crowd: 2, net: "5G", quiet: true },
    { name: "Urban Chai", lat: 9.5880, lng: 76.5350, cat: "Tea Spot", icon: "☕", crowd: 3, net: "5G", quiet: true }
  ];

  function initMap() {
    // Dark Map Tiles matching prototype
    map = L.map('map', { zoomControl: false }).setView([9.5890, 76.5280], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    spots.forEach(spot => {
      const isCrowded = spot.crowd > 15;
      const markerHtml = `
        <div class="spot-marker ${isCrowded ? 'crowded' : ''}">
          <div class="marker-badge-top">👥 ${spot.crowd}</div>
          <span>${spot.icon}</span>
          <div class="marker-badge-bottom">📶 ${spot.net}</div>
        </div>
      `;

      const customIcon = L.divIcon({
        html: markerHtml,
        className: '',
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      const popupContent = `
        <div class="popup-title">${spot.name}</div>
        <div class="popup-sub">${spot.quiet ? '🍃 Quiet Spot' : '🔥 Busy Spot'}</div>
        <div class="popup-tags">
          <span class="popup-tag">👥 ${spot.crowd} People</span>
          <span class="popup-tag">📶 ${spot.net}</span>
        </div>
      `;

      L.marker([spot.lat, spot.lng], { icon: customIcon })
        .addTo(map)
        .bindPopup(popupContent);
    });
  }

  function toggleMic() {
    const val = Math.floor(Math.random() * (42 - 28 + 1)) + 28;
    document.getElementById('mic-db').innerText = val + ' dB';
  }

  function findNearestQuiet() {
    const quietSpot = spots.find(s => s.quiet);
    if (quietSpot) {
      map.flyTo([quietSpot.lat, quietSpot.lng], 16, { duration: 1.5 });
    }
  }

  function dropPin() {
    const center = map.getCenter();
    const markerHtml = `
      <div class="spot-marker">
        <div class="marker-badge-top">NEW</div>
        <span>📍</span>
      </div>
    `;
    const icon = L.divIcon({ html: markerHtml, className: '', iconSize: [44, 44], iconAnchor: [22, 22] });
    L.marker([center.lat, center.lng], { icon: icon }).addTo(map).bindPopup("Custom Spot Dropped").openPopup();
  }

  window.onload = initMap;
</script>
</body>
</html>
