<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spotly - Kottayam Edition</title>
<style>
  :root { 
    --bg: #09090b; --surface: #18181b; --primary: #10b981; 
    --text: #f4f4f5; --text-muted: #a1a1aa; 
  }
  * { box-sizing: border-box; }
  body { 
    margin: 0; font-family: 'Inter', system-ui, sans-serif; 
    background: var(--bg); color: var(--text); height: 100vh; 
    display: flex; flex-direction: column; overflow: hidden; 
  }
  header { 
    display: flex; justify-content: space-between; align-items: center; 
    padding: 14px 16px; background: var(--bg); border-bottom: 1px solid #27272a; z-index: 10; flex-shrink: 0;
  }
  .logo { font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
  .badge { font-size: 0.7rem; background: #27272a; padding: 4px 8px; border-radius: 6px; }
  .live-status { font-size: 0.8rem; color: var(--primary); display: flex; align-items: center; gap: 6px; font-weight: 500;}
  .pulse-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: pulse 1.5s infinite; }

  /* Map container takes remaining vertical space */
  #map { 
    flex: 1 1 auto; 
    width: 100%; 
    min-height: 200px; 
    background: #18181b; 
  }

  /* Fixed Mobile Sheet Scrolling */
  .bottom-panel { 
    background: var(--surface); padding: 20px; border-top-left-radius: 20px; 
    border-top-right-radius: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); 
    z-index: 10; flex-shrink: 0; max-height: 50vh; 
    overflow-y: auto; -webkit-overflow-scrolling: touch; 
  }
  .drag-handle { width: 36px; height: 4px; background: #3f3f46; border-radius: 2px; margin: 0 auto 12px auto; }
  .spot-title { font-size: 1.3rem; margin: 0 0 4px 0; }
  .spot-dist { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; display: flex; gap: 6px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 12px; }
  .card { background: #27272a; padding: 12px 14px; border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
  .card-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .card-val { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 6px; }

  /* Gemini AI Chat UI */
  #ai-fab { 
    position: fixed; bottom: 20px; right: 20px; background: #ffffff; 
    color: #000; border: none; border-radius: 50%; width: 52px; height: 52px; 
    font-size: 22px; cursor: pointer; box-shadow: 0 4px 20px rgba(255,255,255,0.25); 
    z-index: 100; display: flex; align-items: center; justify-content: center; transition: 0.2s;
  }
  #ai-fab:hover { transform: scale(1.05); }
  #ai-window { 
    position: fixed; bottom: 84px; right: 16px; left: 16px; max-width: 380px; margin: 0 auto;
    background: var(--surface); border: 1px solid #3f3f46; border-radius: 16px; 
    display: none; flex-direction: column; overflow: hidden; z-index: 100; 
    box-shadow: 0 10px 40px rgba(0,0,0,0.8); 
  }
  #ai-header { background: #27272a; padding: 14px 16px; font-weight: 600; display: flex; justify-content: space-between; font-size: 0.9rem; }
  #ai-chat { padding: 14px; height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 0.85rem; }
  .msg-ai { background: #27272a; padding: 10px 12px; border-radius: 12px; border-bottom-left-radius: 2px; line-height: 1.4;}
  .msg-user { background: #ffffff; color: #000; padding: 10px 12px; border-radius: 12px; border-bottom-right-radius: 2px; align-self: flex-end; }
  #ai-input-area { display: flex; border-top: 1px solid #3f3f46; background: #1f1f22;}
  #ai-input { flex: 1; background: transparent; border: none; padding: 12px 14px; color: white; outline: none; font-family: inherit; font-size: 0.9rem;}
  #ai-send { background: transparent; border: none; color: #fff; padding: 0 16px; cursor: pointer; font-weight: bold; }

  @keyframes pulse { 
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 
    70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); } 
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } 
  }
</style>
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header>
  <div class="logo">📍 spotly <span class="badge">Kottayam</span></div>
  <div class="live-status"><div class="pulse-dot"></div> Live Network Active</div>
</header>

<div id="map"></div>

<div class="bottom-panel">
  <div class="drag-handle"></div>
  <h2 class="spot-title" id="spot-name">Select a spot on the map</h2>
  <div class="spot-dist" id="spot-dist">📍 Awaiting selection...</div>

  <div class="grid">
    <div class="card">
      <div class="card-label">Live Crowd</div>
      <div class="card-val">👥 <span id="crowd-count">--</span> people</div>
    </div>
    <div class="card">
      <div class="card-label">Network / Traffic</div>
      <div class="card-val">📶 <span id="network-status">--</span></div>
    </div>
    <div class="card">
      <div class="card-label">Category</div>
      <div class="card-val">🍽️ <span id="category">--</span></div>
    </div>
    <div class="card">
      <div class="card-label">Power Outlets</div>
      <div class="card-val">⚡ <span id="power">--</span></div>
    </div>
  </div>
</div>

<button id="ai-fab" onclick="toggleAI()">✨</button>

<div id="ai-window">
  <div id="ai-header">
    <span>Gemini AI Guide</span>
    <span style="cursor:pointer; color:#a1a1aa;" onclick="toggleAI()">✕</span>
  </div>
  <div id="ai-chat">
    <div class="msg-ai">Hey! Looking for the best biriyani spots or chill Gen-Z cafes in Kottayam? Ask away.</div>
  </div>
  <div id="ai-input-area">
    <input type="text" id="ai-input" placeholder="Ask about spots...">
    <button id="ai-send" onclick="sendToGemini()">Send</button>
  </div>
</div>

<script>
  let map, userPos;
  let crowdInterval;

  // Expanded list of popular Kottayam Spots
  const spots = [
    { name: "Nahdi Kuzhimandi", lat: 9.5841, lng: 76.5273, cat: "Biriyani / Mandi", power: "No", baseCrowd: 65 },
    { name: "Calicut Cafe", lat: 9.5895, lng: 76.5221, cat: "Biriyani / Snacks", power: "Yes", baseCrowd: 45 },
    { name: "Tonico Cafe", lat: 9.5962, lng: 76.5414, cat: "Premium Cafe", power: "Yes", baseCrowd: 35 },
    { name: "Third Place", lat: 9.5850, lng: 76.5200, cat: "Coffee / Work Cafe", power: "Yes", baseCrowd: 18 },
    { name: "12 to 12 Barbeque", lat: 9.5875, lng: 76.5245, cat: "Grill / Hangout", power: "No", baseCrowd: 55 },
    { name: "Wheels & Brews", lat: 9.5920, lng: 76.5310, cat: "Cafe / Bikers Hub", power: "Yes", baseCrowd: 28 },
    { name: "Savorites Restaurant", lat: 9.5810, lng: 76.5230, cat: "Kerala Meals & Biriyani", power: "No", baseCrowd: 50 },
    { name: "Anand Bakers & Cafe", lat: 9.5910, lng: 76.5250, cat: "Bakery / Quick Bites", power: "No", baseCrowd: 40 },
    { name: "Urban Chai", lat: 9.5880, lng: 76.5350, cat: "Tea & Chill Spot", power: "Yes", baseCrowd: 22 }
  ];

  function initMap() {
    map = L.map('map').setView([9.5916, 76.5222], 14);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap © CARTO'
    }).addTo(map);

    setTimeout(() => { map.invalidateSize(); }, 400);

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        L.circleMarker([userPos.lat, userPos.lng], {
          radius: 8,
          fillColor: '#10b981',
          color: '#ffffff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map).bindPopup("You are here");
      });
    }

    spots.forEach(spot => {
      const marker = L.marker([spot.lat, spot.lng]).addTo(map);
      marker.on('click', () => renderSpotDetails(spot));
    });
  }

  function renderSpotDetails(spot) {
    document.getElementById('spot-name').innerText = spot.name;
    document.getElementById('category').innerText = spot.cat;
    document.getElementById('power').innerText = spot.power;

    if (userPos) {
      const dist = Math.sqrt(Math.pow(spot.lat - userPos.lat, 2) + Math.pow(spot.lng - userPos.lng, 2)) * 111;
      document.getElementById('spot-dist').innerText = `📍 ${dist.toFixed(1)} km away`;
    } else {
      document.getElementById('spot-dist').innerText = `📍 Selected Spot`;
    }

    clearInterval(crowdInterval);
    updateRealTimeData(spot);
    crowdInterval = setInterval(() => updateRealTimeData(spot), 3000);
  }

  function updateRealTimeData(spot) {
    const variance = Math.floor(Math.random() * 9) - 4;
    const currentCrowd = Math.max(0, spot.baseCrowd + variance);

    document.getElementById('crowd-count').innerText = currentCrowd;

    let network = "Strong 5G";
    if (currentCrowd > 50) network = "Congested 4G/5G";
    if (currentCrowd > 70) network = "Heavy Traffic Layer";
    document.getElementById('network-status').innerText = network;
  }

  window.onload = initMap;

  function toggleAI() {
    const w = document.getElementById('ai-window');
    w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
  }

  async function sendToGemini() {
    const inputField = document.getElementById('ai-input');
    const text = inputField.value.trim();
    if (!text) return;

    const chat = document.getElementById('ai-chat');
    chat.innerHTML += `<div class="msg-user">${text}</div>`;
    inputField.value = '';
    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text })
      });
      const data = await response.json();
      chat.innerHTML += `<div class="msg-ai">${data.reply}</div>`;
    } catch (err) {
      chat.innerHTML += `<div class="msg-ai" style="color:#ef4444;">Error connecting to API endpoint.</div>`;
    }
    chat.scrollTop = chat.scrollHeight;
  }
</script>
</body>
</html>
